<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage Directory</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <header class="sticky top-0 z-40 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Brand / Logo -->
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-500/20 flex items-center justify-center">
                    <i data-lucide="compass" class="w-6 h-6"></i>
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">Nexus</span>
                    <span class="text-xs uppercase tracking-widest text-slate-500 dark:text-slate-400 block font-semibold">Directory</span>
                </div>
            </div>

            <!-- Global Search Bar -->
            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Search links, tags, or URLs... (Press '/' to focus)" 
                        class="w-full bg-slate-100 dark:bg-slate-800/80 text-sm rounded-xl pl-10 pr-10 py-2.5 border border-transparent focus:border-indigo-500 dark:focus:border-indigo-400 focus:bg-white dark:focus:bg-slate-900 focus:outline-none transition-all shadow-inner">
                    <button id="clearSearch" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center space-x-3">
                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors" title="Toggle Theme">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Search Bar -->
        <div class="px-4 pb-3 md:hidden">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="mobileSearchInput" placeholder="Search links, tags, or URLs..." 
                    class="w-full bg-slate-100 dark:bg-slate-800 text-sm rounded-xl pl-10 pr-4 py-2 border border-transparent focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 focus:outline-none">
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar Categories & Filters -->
        <aside class="w-full md:w-64 shrink-0 space-y-6">
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3 px-2">Navigation</h3>
                <nav id="categoryList" class="space-y-1">
                    <!-- Categories injected via JS -->
                </nav>
            </div>

            <!-- Quick Stats & Info -->
            <div class="bg-gradient-to-br from-indigo-500/10 via-purple-500/10 to-pink-500/10 dark:from-indigo-950/30 dark:to-purple-950/30 p-5 rounded-2xl border border-indigo-500/20">
                <div class="flex items-center space-x-3 mb-2">
                    <div class="p-2 bg-indigo-500 text-white rounded-lg shadow">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <h4 class="font-semibold text-sm">Nexus Dashboard</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Quick access hub</p>
                    </div>
                </div>
                <div class="mt-4 pt-3 border-t border-indigo-500/20 flex justify-between text-xs text-slate-600 dark:text-slate-300">
                    <span>Total Links: <strong id="totalCount">0</strong></span>
                    <span>Bookmarks: <strong id="favCount">0</strong></span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 space-y-6">
            <!-- Active Filter Status & Sorting -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="flex items-center space-x-2">
                    <span id="currentCategoryTitle" class="font-bold text-lg">All Links</span>
                    <span id="activeFilterBadge" class="bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 text-xs px-2.5 py-1 rounded-full font-medium">All</span>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-xs text-slate-500">Sort by:</span>
                    <select id="sortSelect" onchange="handleSortChange(this.value)" class="bg-slate-100 dark:bg-slate-800 text-xs font-medium rounded-lg px-3 py-1.5 border border-transparent focus:outline-none focus:border-indigo-500">
                        <option value="default">Default</option>
                        <option value="title">Alphabetical (A-Z)</option>
                        <option value="clicks">Most Visited</option>
                    </select>
                </div>
            </div>

            <!-- Links Grid Container -->
            <div id="linksContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Links injected via JS -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 px-4 text-center bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">
                <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-full flex items-center justify-center mb-4">
                    <i data-lucide="folder-search" class="w-8 h-8"></i>
                </div>
                <h3 class="font-semibold text-lg mb-1">No links found</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 max-w-sm mb-6">We couldn't find any links matching your search or category criteria.</p>
                <button onclick="resetFilters()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">Reset Filters</button>
            </div>
        </div>

    </main>

    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500 dark:text-slate-400">
        <p>Nexus Directory &copy; 2026 — Clean, fast, and hardcoded.</p>
    </footer>

    <script>
        // Initial Sample Data (Hardcoded directly in code)
        const categories = [
            { id: 'all', name: 'All Links', icon: 'layout-grid' },
            { id: 'favorites', name: 'Bookmarks', icon: 'bookmark' },
            { id: 'development', name: 'Development', icon: 'code' },
            { id: 'design', name: 'Design', icon: 'palette' },
            { id: 'news', name: 'News & Tech', icon: 'newspaper' },
            { id: 'social', name: 'Social', icon: 'users' },
            { id: 'tools', name: 'Tools & Utilities', icon: 'wrench' }
        ];

        const links = [
              { id: 1, title: 'GitHub', url: 'https://github.com', category: 'development', icon: 'github', description: 'Where the world builds software and hosts code repositories.', favorite: true, clicks: 42 },
            { id: 2, title: 'Triciy Prop', url: 'https://samk106.github.io/WebTools-Old/tricityprop/', category: 'development', icon: 'globe', description: 'A real estate listings portal.', favorite: true, clicks: 28 },
            { id: 3, title: 'Timeblocks', url: 'https://samk106.github.io/WebTools-Old/time-tracker/', category: 'design', icon: 'globe', description: 'A tasks tracker with timeblocks.', favorite: true, clicks: 19 },
            { id: 4, title: 'Dribbble', url: 'https://dribbble.com', category: 'design', icon: 'dribbble', description: 'Discover the world’s top designers & creatives.', favorite: false, clicks: 12 },
            { id: 5, title: 'Hacker News', url: 'https://news.ycombinator.com', category: 'news', icon: 'trending-up', description: 'Tech news discussion community focusing on computer science.', favorite: true, clicks: 35 },
            { id: 6, title: 'Product Hunt', url: 'https://producthunt.com', category: 'news', icon: 'rocket', description: 'Curated roundup of the best new products in tech every day.', favorite: false, clicks: 15 },
            { id: 7, title: 'X (Twitter)', url: 'https://x.com', category: 'social', icon: 'message-circle', description: 'Real-time global conversation and social network platform.', favorite: false, clicks: 30 },
            { id: 8, title: 'ChatGPT', url: 'https://chatgpt.com', category: 'tools', icon: 'bot', description: 'Advanced AI assistant for writing, coding, and brainstorming.', favorite: true, clicks: 88 },
            { id: 9, title: 'Canva', url: 'https://canva.com', category: 'design', icon: 'image', description: 'Graphic design platform for creating social media graphics and presentations.', favorite: false, clicks: 8 }
        ];

        // State Management (In-memory only, no persistence)
        let currentCategory = 'all';
        let searchQuery = '';
        let currentSort = 'default';

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderLinks();
            updateStats();
            lucide.createIcons();

            // Setup Search Listeners
            const searchInput = document.getElementById('searchInput');
            const mobileSearchInput = document.getElementById('mobileSearchInput');

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                mobileSearchInput.value = searchQuery;
                toggleClearButton(searchQuery);
                renderLinks();
            });

            mobileSearchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                searchInput.value = searchQuery;
                renderLinks();
            });

            // Keyboard shortcut '/' to focus search
            window.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput && document.activeElement !== mobileSearchInput && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        });

        // Theme management (Session-based toggle)
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }

        // Render Sidebar Categories
        function renderCategories() {
            const container = document.getElementById('categoryList');
            container.innerHTML = '';

            categories.forEach(cat => {
                const count = cat.id === 'all' 
                    ? links.length 
                    : cat.id === 'favorites' 
                        ? links.filter(l => l.favorite).length 
                        : links.filter(l => l.category === cat.id).length;

                const isActive = currentCategory === cat.id;

                const btn = document.createElement('button');
                btn.className = `w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${
                    isActive 
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' 
                        : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`;
                
                btn.onclick = () => selectCategory(cat.id, cat.name);
                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <i data-lucide="${cat.icon}" class="w-4 h-4 ${isActive ? 'text-white' : 'text-slate-400'}"></i>
                        <span>${cat.name}</span>
                    </div>
                    <span class="text-xs px-2 py-0.5 rounded-lg ${isActive ? 'bg-indigo-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400'}">${count}</span>
                `;
                container.appendChild(btn);
            });
            lucide.createIcons();
        }

        function selectCategory(catId, catName) {
            currentCategory = catId;
            document.getElementById('currentCategoryTitle').textContent = catName;
            document.getElementById('activeFilterBadge').textContent = catName;
            renderCategories();
            renderLinks();
        }

        function resetFilters() {
            currentCategory = 'all';
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            document.getElementById('currentCategoryTitle').textContent = 'All Links';
            document.getElementById('activeFilterBadge').textContent = 'All';
            renderCategories();
            renderLinks();
        }

        function handleSortChange(sortType) {
            currentSort = sortType;
            renderLinks();
        }

        // Render Links Grid
        function renderLinks() {
            const container = document.getElementById('linksContainer');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            // Filter links
            let filtered = links.filter(link => {
                const matchesCategory = currentCategory === 'all' 
                    ? true 
                    : currentCategory === 'favorites' 
                        ? link.favorite 
                        : link.category === currentCategory;

                const matchesSearch = searchQuery === '' || 
                    link.title.toLowerCase().includes(searchQuery) || 
                    link.description.toLowerCase().includes(searchQuery) || 
                    link.url.toLowerCase().includes(searchQuery);

                return matchesCategory && matchesSearch;
            });

            // Sort links
            if (currentSort === 'title') {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            } else if (currentSort === 'clicks') {
                filtered.sort((a, b) => b.clicks - a.clicks);
            }

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                container.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                container.classList.remove('hidden');
            }

            filtered.forEach(link => {
                const card = document.createElement('div');
                card.className = 'group relative bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 hover:border-indigo-500/50 dark:hover:border-indigo-500/50 hover:shadow-xl hover:shadow-indigo-500/5 transition-all flex flex-col justify-between';
                
                let domain = '';
                try {
                    domain = new URL(link.url).hostname.replace('www.', '');
                } catch(e) {
                    domain = link.url;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-3 mb-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-indigo-600 dark:text-indigo-400 group-hover:scale-110 transition-transform">
                                    <i data-lucide="${link.icon || 'globe'}" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <a href="${link.url}" target="_blank" onclick="incrementClick(${link.id})" class="font-semibold text-slate-900 dark:text-white hover:text-indigo-600 dark:hover:text-indigo-400 transition flex items-center space-x-1.5">
                                        <span>${link.title}</span>
                                        <i data-lucide="external-link" class="w-3.5 h-3.5 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                                    </a>
                                    <span class="text-xs text-slate-400 dark:text-slate-500">${domain}</span>
                                </div>
                            </div>
                            
                            <!-- Bookmark toggle (session only) -->
                            <button onclick="toggleFavorite(${link.id})" class="text-slate-300 dark:text-slate-700 hover:text-amber-400 dark:hover:text-amber-400 transition ${link.favorite ? 'text-amber-400 dark:text-amber-400' : ''}" title="${link.favorite ? 'Remove Bookmark' : 'Add Bookmark'}">
                                <i data-lucide="bookmark" class="w-5 h-5 ${link.favorite ? 'fill-current' : ''}"></i>
                            </button>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4 leading-relaxed">${link.description || 'No description provided.'}</p>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800/80">
                        <span class="text-[10px] uppercase font-semibold tracking-wider px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">${link.category}</span>
                        <span class="text-xs text-slate-400">${link.clicks} visits</span>
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        function incrementClick(id) {
            const link = links.find(l => l.id === id);
            if (link) {
                link.clicks = (link.clicks || 0) + 1;
            }
        }

        function toggleFavorite(id) {
            const link = links.find(l => l.id === id);
            if (link) {
                link.favorite = !link.favorite;
                renderCategories();
                renderLinks();
            }
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = links.length;
            document.getElementById('favCount').textContent = links.filter(l => l.favorite).length;
        }

        function toggleClearButton(query) {
            const clearBtn = document.getElementById('clearSearch');
            if (query && query.length > 0) {
                if(clearBtn) clearBtn.classList.remove('hidden');
            } else {
                if(clearBtn) clearBtn.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
